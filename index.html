<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Number List</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #121212; 
      color: #e2e2e2;
    }
    h1 { text-align: center; color: #fff; }
    .lang-switch { 
      text-align: center; 
      margin-bottom: 15px; 
    }
    .lang-switch button {
      background: #333;
      color: #fff;
      border: none;
      padding: 6px 12px;
      margin: 0 4px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
    }
    .lang-switch button.active {
      background: #00e676;
      color: #000;
    }
    .box { 
      background: #1e1e1e; 
      padding: 15px; 
      margin-bottom: 15px; 
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,255,0,0.05);
    }
    input, select {
      width: 100%; 
      padding: 10px; 
      margin: 6px 0; 
      box-sizing: border-box;
      background: #111; 
      border: 1px solid #333; 
      color: #fff; 
      border-radius: 4px;
    }
    input:focus, select:focus {
      outline: none; 
      border-color: #0f0;
    }
    button {
      padding: 10px 14px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add {
      background: #00c853;
      color: #000;
    }
    .btn-add:hover {
      background: #00e676;
    }
    .btn-export {
      background: #424242;
      color: #fff;
      margin-left: 5px;
    }
    .btn-export:hover {
      background: #616161;
    }
    .btn-small {
      padding: 4px 8px;
      font-size: 12px;
      margin-right: 4px;
    }
    .btn-edit {
      background: #2979ff;
      color: #fff;
    }
    .btn-edit:hover {
      background: #448aff;
    }
    .btn-delete {
      background: #d50000;
      color: #fff;
    }
    .btn-delete:hover {
      background: #ff1744;
    }
    table {
      width: 100%; 
      border-collapse: collapse; 
      background: #1e1e1e;
      color: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #333;
      text-align: center;
    }
    th { 
      background: #272727; 
      font-weight: bold;
    }
    a { 
      color: #00e676; 
      text-decoration: none;
    }
    a:hover { 
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1 id="title">WhatsApp Number List</h1>

<div class="lang-switch">
  <button id="btnEN" class="active" onclick="switchLang('en')">EN</button>
  <button id="btnJP" onclick="switchLang('jp')">JP</button>
</div>

<div class="box">
  <label id="lbl_name">Name / Label</label>
  <input type="text" id="name" placeholder="Number 1 / Promo / etc.">

  <label id="lbl_number">WhatsApp Number (without +)</label>
  <input type="text" id="number" placeholder="6281234567890">

  <label id="lbl_status">Status</label>
  <select id="status">
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
  </select>

  <label id="lbl_date">Activation Date</label>
  <input type="date" id="date">

  <button class="btn-add" id="btnAdd" onclick="addOrUpdateNumber()">+ Add Number</button>
  <button class="btn-export" id="btnExport" onclick="exportTxt()">Export TXT</button>
</div>

<table>
  <thead>
    <tr>
      <th id="th_no">#</th>
      <th id="th_name">Name</th>
      <th id="th_number">Number</th>
      <th id="th_status">Status</th>
      <th id="th_date">Date</th>
      <th id="th_chat">Chat</th>
      <th id="th_actions">Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  let dataList = [];
  let editIndex = null;
  let currentLang = 'en';

  const texts = {
    en: {
      title: "WhatsApp Number List",
      name: "Name / Label",
      number: "WhatsApp Number (without +)",
      status: "Status",
      date: "Activation Date",
      add: "+ Add Number",
      save: "Save Changes",
      export: "Export TXT",
      thNo: "#",
      thName: "Name",
      thNumber: "Number",
      thStatus: "Status",
      thDate: "Date",
      thChat: "Chat",
      thActions: "Actions",
      edit: "Edit",
      del: "Delete",
      required: "Name and Number are required!",
      confirmDelete: "Delete this entry?",
      noData: "No data to export"
    },
    jp: {
      title: "WhatsApp番号リスト",
      name: "名前 / ラベル",
      number: "WhatsApp番号（+なし）",
      status: "ステータス",
      date: "登録日",
      add: "+ 追加",
      save: "変更を保存",
      export: "TXT出力",
      thNo: "番号",
      thName: "名前",
      thNumber: "番号",
      thStatus: "状態",
      thDate: "日付",
      thChat: "チャット",
      thActions: "操作",
      edit: "編集",
      del: "削除",
      required: "名前と番号は必須です。",
      confirmDelete: "このデータを削除しますか？",
      noData: "データがありません"
    }
  };

  const dateInput = document.getElementById('date');
  const btnAdd = document.getElementById('btnAdd');

  function setToday() {
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
  }

  function switchLang(lang) {
    currentLang = lang;
    const t = texts[lang];

    document.getElementById('title').textContent = t.title;
    document.getElementById('lbl_name').textContent = t.name;
    document.getElementById('lbl_number').textContent = t.number;
    document.getElementById('lbl_status').textContent = t.status;
    document.getElementById('lbl_date').textContent = t.date;
    btnAdd.textContent = editIndex !== null ? t.save : t.add;
    document.getElementById('btnExport').textContent = t.export;

    document.getElementById('th_no').textContent = t.thNo;
    document.getElementById('th_name').textContent = t.thName;
    document.getElementById('th_number').textContent = t.thNumber;
    document.getElementById('th_status').textContent = t.thStatus;
    document.getElementById('th_date').textContent = t.thDate;
    document.getElementById('th_chat').textContent = t.thChat;
    document.getElementById('th_actions').textContent = t.thActions;

    document.getElementById('btnEN').classList.toggle('active', lang === 'en');
    document.getElementById('btnJP').classList.toggle('active', lang === 'jp');

    renderTable();
  }

  function saveData() {
    localStorage.setItem('waDataList', JSON.stringify(dataList));
  }

  function loadData() {
    const saved = localStorage.getItem('waDataList');
    if (saved) {
      try {
        dataList = JSON.parse(saved);
      } catch (e) {
        console.error('Failed to parse saved data', e);
        dataList = [];
      }
    }
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    const t = texts[currentLang];

    dataList.forEach((item, i) => {
      const tr = document.createElement('tr');
      const waNumberForLink = (item.number || '').replace('+', '');

      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${item.name}</td>
        <td>${item.number}</td>
        <td>${item.status}</td>
        <td>${item.date}</td>
        <td><a href="https://wa.me/${waNumberForLink}" target="_blank">${t.thChat}</a></td>
        <td>
          <button class="btn-small btn-edit" onclick="editNumber(${i})">${t.edit}</button>
          <button class="btn-small btn-delete" onclick="deleteNumber(${i})">${t.del}</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function addOrUpdateNumber() {
    const nameInput = document.getElementById('name');
    const numberInput = document.getElementById('number');
    const statusSelect = document.getElementById('status');

    const nameVal = nameInput.value.trim();
    let numberVal = numberInput.value.trim();
    const statusVal = statusSelect.value;
    const dateVal = dateInput.value;

    if (!nameVal || !numberVal) {
      alert(texts[currentLang].required);
      return;
    }

    if (!numberVal.startsWith('+')) {
      numberVal = '+' + numberVal;
    }

    const item = {
      name: nameVal,
      number: numberVal,
      status: statusVal,
      date: dateVal
    };

    if (editIndex !== null) {
      dataList[editIndex] = item;
      editIndex = null;
    } else {
      dataList.push(item);
    }

    saveData();
    renderTable();

    // reset input
    nameInput.value = '';
    numberInput.value = '';
    setToday();
    btnAdd.textContent = texts[currentLang].add;
  }

  function editNumber(index) {
    const item = dataList[index];
    if (!item) return;

    document.getElementById('name').value = item.name || '';
    document.getElementById('number').value = (item.number || '').replace('+', '');
    document.getElementById('status').value = item.status || 'Active';
    dateInput.value = item.date || new Date().toISOString().split('T')[0];

    editIndex = index;
    btnAdd.textContent = texts[currentLang].save;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteNumber(index) {
    if (!confirm(texts[currentLang].confirmDelete)) return;

    dataList.splice(index, 1);
    saveData();
    renderTable();

    if (editIndex === index) {
      editIndex = null;
      btnAdd.textContent = texts[currentLang].add;
      document.getElementById('name').value = '';
      document.getElementById('number').value = '';
      setToday();
    }
  }

  function exportTxt() {
    if (dataList.length === 0) {
      alert(texts[currentLang].noData);
      return;
    }

    const lines = dataList.map(item =>
      `${item.name} | ${item.number} | ${item.status} | ${item.date}`
    );

    const text = lines.join('\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'whatsapp_numbers.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // init
  setToday();
  loadData();
  switchLang('en');
</script>

</body>
</html>
