<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="pageTitle">WhatsApp Number List</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #121212; 
      color: #e2e2e2;
    }
    h1 { text-align: center; color: #fff; }
    .box { 
      background: #1e1e1e; 
      padding: 15px; 
      margin-bottom: 15px; 
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,255,0,0.05);
    }
    input, select {
      width: 100%; 
      padding: 10px; 
      margin: 6px 0; 
      box-sizing: border-box;
      background: #111; 
      border: 1px solid #333; 
      color: #fff; 
      border-radius: 4px;
    }
    input:focus, select:focus {
      outline: none; 
      border-color: #0f0;
    }
    button {
      padding: 8px 12px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn-add {
      background: #00c853;
      color: #000;
    }
    .btn-add:hover {
      background: #00e676;
    }
    .btn-export {
      background: #424242;
      color: #fff;
      margin-left: 5px;
    }
    .btn-export:hover {
      background: #616161;
    }
    .btn-clear {
      background: #e53935;
      color: #fff;
      margin-left: 5px;
    }
    .btn-clear:hover {
      background: #ff5252;
    }
    .btn-edit {
      background: #1976d2;
      color: #fff;
      margin-right: 4px;
    }
    .btn-edit:hover {
      background: #2196f3;
    }
    .btn-delete {
      background: #f4511e;
      color: #fff;
      margin-right: 4px;
    }
    .btn-delete:hover {
      background: #ff7043;
    }
    table {
      width: 100%; 
      border-collapse: collapse; 
      background: #1e1e1e;
      color: #fff;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #333;
      font-size: 13px;
    }
    th { 
      background: #272727; 
      font-weight: bold;
    }
    a { 
      color: #00e676; 
      text-decoration: none;
      font-size: 12px;
    }
    a:hover { 
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1 id="titleHeading">WhatsApp Number List</h1>

<div class="box">
  <label id="labelName">Name / Label</label>
  <input type="text" id="name" placeholder="Number 1 / Promo / etc.">

  <label id="labelNumber">WhatsApp Number (without +)</label>
  <input type="text" id="number" placeholder="6281234567890">

  <label id="labelStatus">Status</label>
  <select id="status">
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
  </select>

  <button class="btn-add" id="btnAdd" onclick="addNumber()">+ Add Number</button>
  <button class="btn-export" id="btnExport" onclick="exportTxt()">Export TXT</button>
  <button class="btn-clear" id="btnClear" onclick="clearAll()">Clear All</button>
</div>

<table>
  <thead>
    <tr>
      <th id="thNo">#</th>
      <th id="thName">Name</th>
      <th id="thNumber">Number</th>
      <th id="thStatus">Status</th>
      <th id="thDate">Date & Time</th>
      <th id="thActions">Action</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  const translations = { /* trimmed in this environment for brevity */ };
</script>

</body>
</html>
