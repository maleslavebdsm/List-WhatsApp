<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Number List</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #121212; 
      color: #e2e2e2;
    }
    h1 { text-align: center; color: #fff; }
    .box { 
      background: #1e1e1e; 
      padding: 15px; 
      margin-bottom: 15px; 
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,255,0,0.05);
    }
    input, select {
      width: 100%; 
      padding: 10px; 
      margin: 6px 0; 
      box-sizing: border-box;
      background: #111; 
      border: 1px solid #333; 
      color: #fff; 
      border-radius: 4px;
    }
    input:focus, select:focus {
      outline: none; 
      border-color: #0f0;
    }
    button {
      padding: 8px 12px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn-add {
      background: #00c853;
      color: #000;
    }
    .btn-add:hover {
      background: #00e676;
    }
    .btn-export {
      background: #424242;
      color: #fff;
      margin-left: 5px;
    }
    .btn-export:hover {
      background: #616161;
    }
    .btn-clear {
      background: #e53935;
      color: #fff;
      margin-left: 5px;
    }
    .btn-clear:hover {
      background: #ff5252;
    }
    .btn-edit {
      background: #1976d2;
      color: #fff;
      margin-right: 4px;
    }
    .btn-edit:hover {
      background: #2196f3;
    }
    .btn-delete {
      background: #f4511e;
      color: #fff;
      margin-right: 4px;
    }
    .btn-delete:hover {
      background: #ff7043;
    }
    table {
      width: 100%; 
      border-collapse: collapse; 
      background: #1e1e1e;
      color: #fff;
      margin-top: 10px;
    }
    th, td {
      padding: 8px;
      border: 1px solid #333;
      font-size: 13px;
    }
    th { 
      background: #272727; 
      font-weight: bold;
    }
    a { 
      color: #00e676; 
      text-decoration: none;
      font-size: 12px;
    }
    a:hover { 
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>WhatsApp Number List</h1>

<div class="box">
  <label>Name / Label</label>
  <input type="text" id="name" placeholder="Number 1 / Promo / etc.">

  <label>WhatsApp Number (without +)</label>
  <input type="text" id="number" placeholder="6281234567890">

  <label>Status</label>
  <select id="status">
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
  </select>

  <button class="btn-add" onclick="addNumber()">+ Add Number</button>
  <button class="btn-export" onclick="exportTxt()">Export TXT</button>
  <button class="btn-clear" onclick="clearAll()">Clear All</button>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Number</th>
      <th>Status</th>
      <th>Date & Time</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  const STORAGE_KEY = 'wa_number_list_v5';
  let dataList = [];

  function getNow() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d} ${h}:${min}`;
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    dataList.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${item.name}</td>
        <td>${item.number}</td>
        <td>${item.status}</td>
        <td>${item.date}</td>
        <td>
          <button class="btn-edit" onclick="editName(${idx})">Edit</button>
          <button class="btn-delete" onclick="deleteNumber(${idx})">Delete</button>
          <a href="https://wa.me/${item.number}" target="_blank">Chat</a>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataList));
  }

  function loadFromStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
      dataList = JSON.parse(saved) || [];
    } catch (e) {
      console.error('Failed to parse storage', e);
      dataList = [];
    }
    renderTable();
  }

  function addNumber() {
    const name  = document.getElementById('name').value.trim();
    const number = document.getElementById('number').value.trim();
    const status = document.getElementById('status').value;

    if (!name || !number) {
      alert('Name and Number are required!');
      return;
    }

    const date = getNow();
    dataList.push({ name, number, status, date });
    saveToStorage();
    renderTable();

    document.getElementById('name').value = '';
    document.getElementById('number').value = '';
  }

  function editName(index) {
    const current = dataList[index];
    const newName = prompt('Edit name:', current.name);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed) {
      alert('Name cannot be empty.');
      return;
    }
    dataList[index].name = trimmed;
    saveToStorage();
    renderTable();
  }

  function deleteNumber(index) {
    if (!confirm('Delete this number?')) return;
    dataList.splice(index, 1);
    saveToStorage();
    renderTable();
  }

  function exportTxt() {
    if (dataList.length === 0) {
      alert('No data to export');
      return;
    }

    const lines = dataList.map(item =>
      `${item.name} | ${item.number} | ${item.status} | ${item.date}`
    );

    const text = lines.join('\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'whatsapp_numbers.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function clearAll() {
    if (!confirm('Delete ALL data?')) return;
    dataList = [];
    saveToStorage();
    renderTable();
  }

  window.addEventListener('DOMContentLoaded', loadFromStorage);
</script>

</body>
</html>
